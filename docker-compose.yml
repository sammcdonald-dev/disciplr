#version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bible-chat

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: always
    command: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bible-chat-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bible-chat
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      CHOKIDAR_USEPOLLING: true
    depends_on:
      - postgres
      - redis
    command: sh -c "npm run db:migrate && npm run dev"

volumes:
  postgres_data:
  redis_data:
